name: Correction
description: Something on the page is wrong or out of date.
title: "Correction: "
labels: ["[Area] Content"]
body:
  - type: textarea
    id: correction
    attributes:
      label: What's wrong, and what should it say?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      placeholder: https://
    validations:
      required: true
