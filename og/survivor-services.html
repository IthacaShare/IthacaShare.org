<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Source Serif 4";
    font-weight: 400 700;
    src: url("../public/fonts/source-serif-4-latin.woff2") format("woff2");
  }
  * { box-sizing: border-box; margin: 0; text-wrap: balance; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #1a1814;
    color: #fff7f5;
    font-family: "Source Serif 4", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    padding: 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .big { font-size: 140px; line-height: 0.95; font-weight: 600; letter-spacing: -0.03em; }
  .foot { display: flex; align-items: flex-end; justify-content: space-between; }
  .pay { display: flex; align-items: center; gap: 18px; font-size: 48px; font-weight: 600; }
  /* The whole image is the big amount; the dot's area is the small amount, to scale. */
  .dot { width: calc(sqrt(1200 * 630 * 5125000 / 439000000) * 1px); aspect-ratio: 1; background: #141210; flex: none; }
  .url { font-size: 32px; opacity: 0.85; }
</style>
</head>
<body>
  <div>
    <div class="big">Weekdays,<br>9 to 5.</div>
    <div class="pay" style="margin-top:28px">“Not a crisis service.” Cornell’s own victim advocates.</div>
  </div>
  <div class="foot">
    <div></div>
    <div class="url">ithacashare.org</div>
  </div>
</body>
</html>
